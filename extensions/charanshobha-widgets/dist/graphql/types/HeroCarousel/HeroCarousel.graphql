"""
Hero carousel widget: full-width image slides managed from the page builder.
`slides` is a JSON array of
{ id, image, mobileImage, width, height, mobileWidth, mobileHeight,
  eyebrow, headline, subText, buttonText, buttonLink }.
"""
type HeroCarouselWidget {
  slides: JSON
  autoplay: Boolean
  autoplaySpeed: Int
}

extend type Query {
  heroCarouselWidget(
    slides: JSON
    autoplay: Boolean
    autoplaySpeed: Int
  ): HeroCarouselWidget
}
